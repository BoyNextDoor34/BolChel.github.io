name: Repair site runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Patch broken frontend files
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '') || 'main';

            async function read(path) {
              const r = await github.rest.repos.getContent({owner, repo, path, ref: branch});
              return { sha: r.data.sha, text: Buffer.from(r.data.content, 'base64').toString('utf8') };
            }

            async function write(path, text, sha, message) {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch, sha,
                message,
                content: Buffer.from(text, 'utf8').toString('base64')
              });
            }

            const app = await read('app.js');
            let js = app.text;
            js = js.replace("[['G','T'],[['G','-'],'Военнообязанные']", "[['G','T'],'Туризм'],[['G','M'],'Военнообязанные']");
            if (!/const\s+DEMO_NEWS\s*=/.test(js)) {
              const demo = `const DEMO_NEWS = [
                {id:'demo-1',category:'Технологии и наука',title:'Новая вычислительная архитектура обещает снизить энергозатраты ИИ',summary:'Демонстрационный материал для проверки новостного интерфейса.',date:'27 сентября 2026',time:'12:10',author:'Редакция',image:'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1400&q=82',body:'# Новая вычислительная архитектура\\n\\nДемонстрационный материал интерфейса.',palette:null},
                {id:'demo-2',category:'Общество',title:'Города расширяют общественные пространства',summary:'Демонстрационная новость для проверки карточек и навигации.',date:'27 сентября 2026',time:'11:20',author:'Редакция',image:'https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=1100&q=82',body:'## Городская среда\\n\\nДемонстрационный материал.',palette:null},
                {id:'demo-3',category:'Экономика',title:'Малый бизнес ускоряет переход на цифровые расчёты',summary:'Демонстрационная новость для проверки разделов.',date:'27 сентября 2026',time:'10:15',author:'Редакция',image:'https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=1100&q=82',body:'### Цифровые расчёты\\n\\nДемонстрационный материал.',palette:null}
              ];\n\n`;
              js = js.replace('const state = {', demo + 'const state = {');
            }
            js = js.replace("function toggleHelp(expanded=true){\n  state.expandedHelp=expanded;\n  $('#whichkey-panel').classList.toggle('is-expanded',expanded);", "function toggleHelp(expanded=true){\n  const panel=$('#whichkey-panel');\n  if(!panel) return;\n  state.expandedHelp=expanded;\n  panel.classList.toggle('is-expanded',expanded);\n  panel.setAttribute('aria-hidden', expanded ? 'false' : 'true');");
            js = js.replace("if(expanded){ $('#whichkey-panel').scrollTo({top:0,behavior:'smooth'}); $('#close-help').focus({preventScroll:true}); }", "if(expanded){ panel.scrollTo({top:0,behavior:'smooth'}); $('#close-help')?.focus({preventScroll:true}); }");
            if (js === app.text) core.setFailed('Expected frontend patterns were not found.');
            await write('app.js', js, app.sha, 'Fix frontend JavaScript bootstrap and keyboard help');

            const index = await read('index.html');
            let html = index.text;
            html = html.replace('Desktop / WhichKey', 'Горячие клавиши');
            html = html.replace(/\n\s*<aside id="whichkey-mini"[\s\S]*?<\/aside>\n/, '\n');
            await write('index.html', html, index.sha, 'Hide persistent keyboard cheat sheet');

            const css = await read('styles.css');
            let style = css.text;
            style = style.replace('--help-side: 360px;', '--help-side: 0px;');
            style = style.replace('right:var(--help-side);', 'right:0;');
            style = style.replace('margin-right:var(--help-side);', 'margin-right:0;');
            style = style.replace('.whichkey-panel { position:fixed;', '.whichkey-panel { display:none; position:fixed;');
            style = style.replace('.whichkey-panel.is-expanded { width:min(520px, calc(100vw - 32px)); border-color:var(--md-sys-color-primary); }', '.whichkey-panel.is-expanded { display:block; width:min(520px, calc(100vw - 32px)); border-color:var(--md-sys-color-primary); }');
            style = style.replace('.whichkey-mini { position:fixed;', '.whichkey-mini { display:none !important; position:fixed;');
            await write('styles.css', style, css.sha, 'Remove persistent right-side keyboard panel');
