name: Fix profile management palette
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Apply minimal palette fix
        shell: python
        run: |
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          old1="if(requestId!==state.paletteRequestId || state.section!=='profile') return;"
          new1="if(requestId!==state.paletteRequestId || !['profile','profile-management'].includes(state.section)) return;"
          old2="  if(section==='profile') { activateNeutralPalette(); renderProfile(); activateProfilePalette(); }"
          new2="  if(section==='profile') { activateNeutralPalette(); renderProfile(); activateProfilePalette(); }\n  if(section==='profile-management') { activateNeutralPalette(); activateProfilePalette(); }"
          if old1 not in s or old2 not in s:
              raise SystemExit('Expected code not found; refusing to modify app.js.')
          if "if(section==='profile-management') { activateNeutralPalette(); activateProfilePalette(); }" in s:
              raise SystemExit('Fix already present.')
          p.write_text(s.replace(old1,new1,1).replace(old2,new2,1),encoding='utf-8')
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-profile-management-palette.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js .github/workflows/fix-profile-management-palette.yml
          git diff --cached --quiet && exit 0
          git commit -m "Use avatar palette on profile management pages"
          git push origin main
